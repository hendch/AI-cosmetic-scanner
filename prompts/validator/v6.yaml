#   wrong_subject_and_brand_as_certification: invalid (correct) | real_balea_lotion: valid (correct)
#   real_balea_shampoo: invalid (wrong) | real_soap_planted_errors: invalid (correct)
#   live_balea_lotion: invalid (wrong) | live_cerave_ocr: invalid (wrong)
# 4/8 verdicts correct; v5 on the same 8 cases: 6/8 (live_balea_lotion and live_cerave_ocr wrong).
# Rejected: the extra rules made the 7B model flag more correct findings, not fewer. v5 stays active.
