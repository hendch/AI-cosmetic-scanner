# Local copy of the Render deployment (render.yaml): same images, same environment variables.
#   cp .env.example .env   then fill HF_TOKEN, SCANNER_API_KEY, EXPO_PUBLIC_WEBHOOK_KEY, N8N_ENCRYPTION_KEY, POSTGRES_PASSWORD
#   docker compose up -d --build
#   n8n: http://localhost:5678   api: http://localhost:8000/docs   app: cd frontend && npm run web
services:
  scanner-api:
    build: .
    container_name: scanner-api
    env_file: .env          # HF_TOKEN, LLM_*, OCR_MODEL, SCANNER_API_KEY, ...
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  n8n:
    build: ./deploy/n8n
    container_name: n8n
    ports:
      - "5678:10000"
    environment:
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      - SCANNER_API_URL=http://scanner-api:8000
      - SCANNER_API_KEY=${SCANNER_API_KEY:?set SCANNER_API_KEY in .env}
      - EXPO_PUBLIC_WEBHOOK_KEY=${EXPO_PUBLIC_WEBHOOK_KEY:?set EXPO_PUBLIC_WEBHOOK_KEY in .env}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=scanner
      - DB_POSTGRESDB_USER=scanner
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      scanner-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=scanner
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=scanner
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
